name: Database migrations

on:
  push:
    branches: [dev, main]
    paths:
      - "packages/db/drizzle/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

# Never cancel a run mid-migration; queue the next push behind it instead.
concurrency:
  group: db-migrate-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each GitHub Environment holds its own DATABASE_URL secret.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter "@repo/db..."

      - name: Apply migrations
        run: pnpm --filter @repo/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
